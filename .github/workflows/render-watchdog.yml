name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the hosted service
        run: |
          curl --fail --max-time 90 --retry 3 --retry-all-errors \
            https://langmesh-agent.onrender.com/healthz
