# @langmesh[bot] (also @langmesh) on an issue or pull request runs the library in this job.
# A later mention on the same thread continues the saved session.
# LANGMESH_MODEL is provider/model. LANGMESH_API_KEY is that provider's key.
# Optional LANGMESH_APP_ID / LANGMESH_APP_PRIVATE_KEY post as langmesh[bot].
# .github/langmesh holds the checkpoint (conversation and provider cache state).

name: langmesh

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: langmesh-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mention:
    if: >
      contains(github.event.comment.body, '@langmesh')
      && github.event.comment.user.type != 'Bot'
      && (github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Step `if:` cannot read `secrets`. Copy presence into env so the App token step is optional.
    env:
      HAVE_LANGMESH_APP: ${{ secrets.LANGMESH_APP_ID != '' && secrets.LANGMESH_APP_PRIVATE_KEY != '' }}
      LANGMESH_APP_ID: ${{ secrets.LANGMESH_APP_ID }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        if: env.HAVE_LANGMESH_APP == 'true'
        with:
          app-id: ${{ secrets.LANGMESH_APP_ID }}
          private-key: ${{ secrets.LANGMESH_APP_PRIVATE_KEY }}
      - id: ack
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          number="${{ github.event.issue.number || github.event.pull_request.number }}"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
            -f body="Got it — I'll update this comment when I'm done." \
            --jq .id)"
          echo "comment_id=${id}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/cache/restore@v4
        with:
          path: .venv
          key: langmesh-venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            langmesh-venv-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: .github/langmesh
          key: langmesh-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            langmesh-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}-
      - run: uv sync --no-dev --frozen
      - run: uv run --no-dev --frozen python -m langmesh.github
        env:
          LANGMESH_MODEL: ${{ vars.LANGMESH_MODEL }}
          LANGMESH_API_KEY: ${{ secrets.LANGMESH_API_KEY }}
          LANGMESH_MENTION: ${{ vars.LANGMESH_MENTION }}
          LANGMESH_ACK_COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          LANGMESH_GIT_NAME: ${{ steps.app.outcome == 'success' && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          LANGMESH_GIT_EMAIL: ${{ steps.app.outcome == 'success' && format('{0}+{1}[bot]@users.noreply.github.com', env.LANGMESH_APP_ID, steps.app.outputs.app-slug) || '41898282+github-actions[bot]@users.noreply.github.com' }}
      - uses: actions/cache/save@v4
        if: ${{ always() && hashFiles('.venv/pyvenv.cfg') != '' }}
        with:
          path: .venv
          key: langmesh-venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - uses: actions/cache/save@v4
        if: ${{ always() && hashFiles('.github/langmesh/session.sqlite') != '' }}
        with:
          path: .github/langmesh
          key: langmesh-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_id }}
