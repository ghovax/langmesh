# @langmesh on an issue or pull request runs the library in this job.
# A later mention on the same thread continues the saved session.
# LANGMESH_MODEL is provider/model. LANGMESH_API_KEY is that provider's key.

name: langmesh

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: langmesh-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mention:
    if: contains(github.event.comment.body, '@langmesh')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: .langmesh-github
          key: langmesh-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            langmesh-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}-
      - run: uv sync --no-dev
      - run: uv run python -m langmesh.github.mention
        env:
          LANGMESH_MODEL: ${{ vars.LANGMESH_MODEL }}
          LANGMESH_API_KEY: ${{ secrets.LANGMESH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
