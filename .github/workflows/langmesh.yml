# @langmesh[bot] (also @langmesh), or a reply to the bot, on an issue or pull request
# runs the library in this job. The ack step decides whether the comment is a turn.
# A later mention on the same thread continues the saved session.
# Model and provider come from .agents/agents/<name>/AGENT.md, named in
# .github/langmesh.yaml. LANGMESH_API_KEY is written to a secret file at job start.
# Optional LANGMESH_APP_PRIVATE_KEY plus app_id in .github/langmesh.yaml post as the App.
# .github/langmesh holds the checkpoint (conversation and provider cache state).
# issue_comment cannot write the Actions cache, so the session is an artifact.

name: langmesh

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  # Bot ack comments must not share the human queue or they sit pending for the whole turn.
  group: langmesh-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.user.type }}
  cancel-in-progress: false

jobs:
  mention:
    if: >
      github.event.comment.user.type != 'Bot'
      && (github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
      HAVE_LANGMESH_APP_KEY: ${{ secrets.LANGMESH_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: policy
        run: python3 src/langmesh/github/policy.py
      - uses: actions/create-github-app-token@v2
        id: app
        if: env.HAVE_LANGMESH_APP_KEY == 'true' && steps.policy.outputs.app_id != ''
        with:
          app-id: ${{ steps.policy.outputs.app_id }}
          private-key: ${{ secrets.LANGMESH_APP_PRIVATE_KEY }}
      - id: ack
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: python3 src/langmesh/github/ack.py
      - uses: astral-sh/setup-uv@v6
        if: steps.ack.outputs.start == 'true'
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/cache/restore@v4
        if: steps.ack.outputs.start == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path: .venv
          key: langmesh-venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            langmesh-venv-${{ runner.os }}-
      - if: steps.ack.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/langmesh/github/session_store.py restore
      - if: steps.ack.outputs.start == 'true'
        run: uv sync --no-dev --frozen
      - if: steps.ack.outputs.start == 'true'
        env:
          LANGMESH_API_KEY: ${{ secrets.LANGMESH_API_KEY }}
          LANGMESH_APP_PRIVATE_KEY: ${{ secrets.LANGMESH_APP_PRIVATE_KEY }}
        run: python3 src/langmesh/github/materialize.py
      - if: steps.ack.outputs.start == 'true'
        run: uv run --no-dev --frozen python -m langmesh.github
        env:
          LANGMESH_ACK_COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          LANGMESH_GIT_NAME: ${{ steps.app.outcome == 'success' && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          LANGMESH_GIT_EMAIL: ${{ steps.app.outcome == 'success' && format('{0}+{1}[bot]@users.noreply.github.com', steps.policy.outputs.app_id, steps.app.outputs.app-slug) || '41898282+github-actions[bot]@users.noreply.github.com' }}
      - uses: actions/cache/save@v4
        if: ${{ always() && hashFiles('.venv/pyvenv.cfg') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path: .venv
          key: langmesh-venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('.github/langmesh/session.sqlite') != '' }}
        with:
          name: langmesh-session-${{ github.event.issue.pull_request && 'pull' || github.event.pull_request && 'pull' || 'issue' }}-${{ github.event.issue.number || github.event.pull_request.number }}
          path: .github/langmesh
          include-hidden-files: true
          overwrite: true
          retention-days: 14
