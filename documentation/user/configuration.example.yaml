# Every setting LangMesh has, at the value it ships with.
#
# Do not copy this over ~/.config/langmesh/configuration.yaml.
#
# Everything here is already the default, so a copy changes nothing today and pins all of it
# tomorrow: a release that improves one of these values would find your file overriding it with
# the old one, from a line nobody remembers writing. That is why the file you actually get on
# first run is nearly empty — it holds only what you supply, and everything else stays where it
# can still move.
#
# What exists, what it ships at, and what this machine currently runs:
# the settings panel, or the configuration reference in the docs.
#
# Set one, read one, put one back — in this file, not through a command:
#
#     workspace:
#       strategy: worktree
#
# A setting you never touched may be absent; omit it and the default applies.
# To unset a setting, remove its line from the file.
#
# A name that is not in the schema is refused at load rather than written and ignored.


# Credentials

# API keys live as 0600 files under $XDG_DATA_HOME/langmesh/secrets/
# (providers.<id>.api_key). Which model a session runs is chosen by its agent
# profile, except mailbox sessions which may overlay email.provider and
# email.model. The full list is in langmesh.base.identity.providers.

providers: {}
  # anthropic:
  #   api_key: ""
  # openai:
  #   api_key: ""
  # custom:
  #   api_key: ""
  #   base_url: "https://…"

# Exa backs the built-in web search. The key is the secret file exa.api_key.
exa:
  api_key: ""

# Optional readers for fetch_url. Without them it falls back to its own extraction.
jina:
  api_key: ""
firecrawl:
  api_key: ""
  # Point at a self-hosted instance; empty means Firecrawl's own.
  api_url: ""
web_fetch:
  # Route page fetches through a proxy — for a site that refuses this machine's address.
  proxy_url: ""
  # How long one reader engine is given before the cascade moves on to the next.
  timeout_seconds: 30
  # How long a download is given, which is longer because it carries the whole file.
  download_timeout_seconds: 120
  # Below this a page is a wall or a stub rather than the content, so the next engine is tried.
  minimum_useful_characters: 64


# What a session may do

agent:
  # ask | automatic — who answers when a call asks to reach past the confinement. A session can be
  # started with its own;
  # this is what it gets when nobody says.
  permission_mode: "ask"

# The operating system's answer to "what can this process reach", enforced before the process
# starts rather than checked as it runs. `required` refuses to start a session it cannot confine.
sandbox:
  enforce: "required"
  filesystem:
    # Readable outside the workspace: configuration and toolchains a build genuinely needs.
    readable:
      - "~/.agents"
      - "~/.config"
      - "~/.local"
      - "~/.ssh"
      - "~/.gitconfig"
      - "~/.gitignore_global"
      - "~/.cargo"
      - "~/.rustup"
      - "~/.npmrc"
      - "~/.nvm"
      - "~/.pyenv"
      - "~/.docker"
      - "~/.netrc"
      - "~/Library/Keychains"
    # Writable. $WORKSPACE is the session's own directory; the rest is scratch.
    writable:
      - "$WORKSPACE"
      - "$TMPDIR"
      - "$XDG_CACHE_HOME"
      - "~/.cache"
    # Absolute bans that no per-call access request may open. Empty by default.
    deny: []
  network: true
  # setrlimit, by the constant's own name: no core dumps, 8 GiB per file, 2048 processes.
  limits:
    RLIMIT_CORE: 0
    RLIMIT_FSIZE: 8589934592
    RLIMIT_NPROC: 2048
  # null leaves the inherited umask alone.
  umask: null
  nice: 0

workspace:
  # none | worktree. `worktree` gives each session its own git worktree, so two sessions in one
  # repository cannot tread on each other.
  strategy: "none"


# Keeping a long conversation alive

# At the recommended preparation boundary the agent updates the workspace registry through a
# private Bash-only segment; then older messages are dropped and the recent part stays word for word.

compaction:
  automatic: true
  # Recommended preparation boundary. Late on purpose, with reserved room for the registry checkpoint.
  reclaim_at_fraction: 0.85
  # Safety space for the preparation segment and answer. Every other fraction is a share of what remains.
  output_reserve_fraction: 0.1
  # How much recent conversation stays verbatim. Tokens rather than turns, because an unattended
  # run is one instruction and several hundred tool results.
  recent_working_set_fraction: 0.15

# What a file the person attaches may cost the conversation it rides in
attachments:
  # The ceiling on an image inlined for a vision model. Above it the path and metadata still reach
  # the model, but the pixels do not — a huge image would otherwise ride in the conversation forever.
  inline_image_megabytes: 20

# An opt-in snapshot of this machine and its habits, offered to the agent at the start of a
# session. Off by default: it is about you, not about the code.
user_context:
  enabled: false
  # Rebuilt in the background once it is this old, so no message ever waits for the probes.
  refresh_hours: 6


# The tools a session installs for itself. On where the machine has Nix: each session gets a
# package profile of its own at the front of its PATH, so a missing tool is something the agent
# installs rather than a wall it works around. What it installs is deleted with the session, and
# nothing reaches your own profile. Turn it off to keep every session to what the machine has.
toolbox:
  enabled: true


# Driving the screen

computer_control:
  # Opt-in, and it also needs Accessibility granted in System Settings. It drives native macOS
  # apps and your own Chrome — the windows you are working in, not a clean automation target.
  enabled: false

  # How a screen is ranked when a script asks for an element by name.
  #
  # Three signals score every element and are added: two embeddings read what a query *means*, a
  # character similarity reads how it is *spelled*. The models are used together rather than
  # chosen between — alone, the English one is worse on native windows, where a query usually
  # quotes a label that is visible. Clearing a name turns that model off; clearing both leaves
  # BM25, which is also how to get the older single-model ranking back.
  retrieval:
    multilingual_rank_model: "minishlab/M2V_multilingual_output"
    english_rank_model: "minishlab/potion-base-32M"
    # The gate on the character signal. At or below `short`, a query is a quoted label and its
    # spelling is the strongest evidence there is — this is what lets a retyped number, a changed
    # case, or a label the interface truncated still find its element. At or above `long`, a
    # query is a description that shares no spelling with anything, so the signal is dropped
    # rather than left to rank by coincidence. It fades out linearly between the two.
    lexical_gate_short_words: 3
    lexical_gate_long_words: 7

# Speech to text for the composer, on this machine. Apple Silicon only. The weights are not
# bundled and download on first use.
dictation:
  enabled: false
  model: "mlx-community/parakeet-tdt-0.6b-v3"
  timing:
    # The floor on one transcription, plus a multiplier per second of audio. Transcription runs
    # faster than real time here, so reaching the limit means stuck rather than busy.
    minimum_transcription_timeout_seconds: 30.0
    transcription_timeout_realtime_multiplier: 0.5
    maximum_attempts: 2
    worker_shutdown_seconds: 2.0


# The daemon's own lifecycle timings. These are the daemon process's, never the library's.
daemon:
  # How long to wait for the daemon to come up after starting it.
  startup_seconds: 45.0
  # How often a probe retries a not-yet-listening daemon, and how long each connect may wait.
  probe_interval_seconds: 0.05
  probe_connect_seconds: 0.5
  # How long an idle hosted session keeps its process before it sleeps (five hours).
  session_idle_sleep_seconds: 18000.0


# IMAP IDLE plus SMTP in front of the daemon. Off until you enable it.
# Passwords are secret files email.imap.password and email.smtp.password.
# email.provider and email.model overlay the agent profile for mailbox sessions.
# OAuth is email.auth: oauth plus email.oauth.refresh_token (`langmesh mail auth`).
# See documentation/user/email.md.
email:
  enabled: false
  address: ""
  allow_from: []
  agent: "reviewer"
  provider: ""
  model: ""
  auth: "password"
  working_directory: ""
  permission_mode: "automatic"
  idle_timeout_seconds: 60.0
  turn_timeout_seconds: 1800.0
  oauth:
    issuer: ""
    client_id: ""
    tenant: "common"
    token_url: ""
    authorize_url: ""
    scopes: []
    redirect_uri: "http://127.0.0.1:8765/callback"
    client_secret: ""
    refresh_token: ""
  imap:
    host: ""
    port: 993
    username: ""
    password: ""
    mailbox: "INBOX"
    ssl: true
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    start_tls: true
    use_tls: false


# Other tools, other machines

# Composio's hosted MCP gateway, as one server.
composio:
  enabled: false
  url: "https://connect.composio.dev/mcp"
  api_key: ""
  server_name: "composio"
  timeout_seconds: 60

# Mirrors what .agents/mcp.json declares and is normally edited there. A folder's servers join
# the shared pool when a session in that folder starts.
mcp:
  servers: {}
    # code-indexer:
    #   command: "npx"
    #   args: ["-y", "@scope/server"]

# Sessions on other machines, reachable as peers.
remote_agents:
  agents: {}
    # build-runner:
    #   url: "https://…"

telemetry:
  enabled: false
  exporter:
    endpoint: ""
    protocol: "http/protobuf"
    headers: {}
  sample_ratio: 1.0


# Tool budgets and timing
# Every limit ships as a plain value; nothing scales with the live window, so what you set is what runs.

tuning:
  # `limits` sets one field of langmesh.base.primitives.limits.Limits by its own name and unit; an unknown name is an error.
  limits:

    # Text budgets, in tokens (powers of two).
    output_tokens: 16384
    fetch_tokens: 32768
    upstream_error_detail_tokens: 256

    # Listing budgets, in item counts (powers of two).
    web_search_maximum: 16
    web_exchanges: 256
    web_websockets: 32
    web_websocket_frames: 256

    # Timeouts, in seconds.
    action_timeout: 5.0
    navigation_timeout: 20.0
    snapshot_timeout: 10.0
    browser_authorization: 90.0
    drag_timeout: 8.0
    read_text_timeout: 10.0
    frame_resolve_timeout: 2.0
    sigterm_grace: 3.0
    bash_sync_window: 60.0
    slow_tool_sync_window: 10.0
    web_search_sync_window: 10.0
    accessibility_messaging: 2.0
    control_script: 120.0
    surface_guard_margin: 30.0
    open_url: 5.0
    model_silence_give_up: 180.0

    # Surface settling, in seconds and reads.
    settle_poll_seconds: 0.05
    settle_give_up_seconds: 1.5
    settle_stable_reads: 2

    # Synthesised input: how a click, a drag and a keystroke are physically paced (sizes are powers of two).
    type_chunk_size: 32
    type_chunk_interval: 0.005
    drag_steps: 16
    drag_step_interval: 0.01
    click_interval: 0.01
    focus_settle: 0.03
    scroll_amount_pixels: 512
    accessibility_walk_budget: 3.0
    accessibility_ready_probe: 0.4
    accessibility_prewarm_interval: 0.4
    accessibility_ready_backoff: 0.2

    # Screen retrieval ranking.
    find_rephrasing_similarity: 0.45
    find_near_weight: 0.5
    find_anchor_margin: 0.02
    find_candidates: 8
    find_one_margin: 0.2
    find_many_ceiling: 64
    find_relevance_floor: 0.25

    # Other process and identity budgets, in seconds unless named otherwise.
    session_title_attempts: 4
    permission_reviewer_attempts: 4
    model_catalogue_ttl: 60.0
    credential_refresh_leeway: 300.0
    oauth_poll_interval: 1.0
    oauth_poll_ceiling: 10.0
    oauth_poll_give_up: 300.0
    subscription_resume_ttl: 1800.0
    file_url_ttl: 600.0
    mcp_connect: 20.0
    card_resolve: 20.0
