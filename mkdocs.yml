site_name: LangMesh
site_description: Library and product documentation for the LangMesh agent harness
repo_url: https://github.com/ghovax/langmesh
docs_dir: documentation
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Library:
      - Start here: library/index.md
      - Composition: library/composition.md
      - Lifecycle and driving: library/lifecycle.md
      - Persistence: library/persistence.md
      - API reference: library/api.md
  - User guide:
      - Installation: user/installation.md
      - Desktop app: user/app.md
      - Configuration: user/configuration.md
      - Agent system: user/agent-system.md
  - Internals:
      - Architecture: internal/architecture.md
      - Development: internal/development.md
  - Security: https://github.com/ghovax/langmesh/blob/main/SECURITY.md
strict: true
