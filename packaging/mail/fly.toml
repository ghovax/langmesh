# Fly.io: daemon + mail client with a persistent XDG volume.
# Deploy from the checkout root so the Docker context is the repository (the
# Dockerfile copies pyproject.toml, src, and .agents from there):
#   fly volumes create langmesh_xdg --size 3 --region iad --yes
#   # Policy lives on the volume as configuration.yaml. Fly secrets are an import
#   # into $XDG_DATA_HOME/langmesh/secrets (OPENCODE_API_KEY, and a leftover mail.env).
#   fly deploy . --config packaging/mail/fly.toml --dockerfile packaging/mail/Dockerfile
#
# No http_service: Fly Proxy will not autostop a worker with no services.
# restart always: IMAP IDLE is the process; it must come back after a crash.

app = "langmesh-mail"
primary_region = "iad"

kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  dockerfile = "packaging/mail/Dockerfile"

[mounts]
  source = "langmesh_xdg"
  destination = "/srv/langmesh/xdg"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[restart]]
  policy = "always"
  retries = 10
