# The file LangMesh creates at ~/.config/langmesh/configuration.yaml on first run.
#
# Deliberately small. Policy and the conversation-compaction settings are explicit; credentials
# are 0600 files under $XDG_DATA_HOME/langmesh/secrets/. Other settings stay at their schema
# defaults so they can still improve without being pinned here.
#
# To see what there is to change:   read configuration-reference.md, or open Settings
# To change one:                    edit this file: workspace:
#                                     strategy: worktree
# To put it back:                   remove the line, and the default applies
#
# A name that is not in the schema is refused rather than written and ignored.
#
# Email (IMAP IDLE + SMTP) is an app-owned section. It is off until you enable it;
# see documentation/user/email.md. Passwords and OAuth refresh tokens live as 0600
# files under $XDG_DATA_HOME/langmesh/secrets/, not in this document. Mailbox
# sessions may overlay email.provider and email.model onto the agent profile.

# Model provider credentials. API keys live as secret files
# (providers.<id>.api_key). Which model a session runs is chosen by its
# agent profile, except mailbox sessions which may overlay email.provider
# and email.model. The full provider list is in langmesh.base.identity.providers.
providers:
  anthropic:
    api_key: ""
  openai:
    api_key: ""
  google:
    api_key: ""
  openrouter:
    api_key: ""
  xai:
    api_key: ""

# Exa backs the built-in web search. The key is the secret file exa.api_key.
exa:
  api_key: ""

# Read-only credential and toolchain roots needed by ordinary project commands.
sandbox:
  filesystem:
    readable:
      - "~/.agents"
      - "~/.config"
      - "~/.local"
      - "~/.ssh"
      - "~/.gitconfig"
      - "~/.gitignore_global"
      - "~/.cargo"
      - "~/.rustup"
      - "~/.npmrc"
      - "~/.nvm"
      - "~/.pyenv"
      - "~/.docker"
      - "~/.netrc"
      - "~/Library/Keychains"

# Conversation history always streams continuously from newest to oldest; there is no paging or row-limit setting.
compaction:
  automatic: true
  reclaim_at_fraction: 0.85
  output_reserve_fraction: 0.1
  recent_working_set_fraction: 0.15
