# The file LangMesh creates at ~/.config/langmesh/configuration.yaml on first run.
#
# Deliberately small. Credentials and the conversation-compaction policy are explicit; other settings
# stay at their schema defaults so they can still improve without being pinned here.
#
# To see what there is to change:   langmesh configure --all
# To change one:                    langmesh configure workspace.strategy worktree
# To read one:                      langmesh configure workspace.strategy
# To put it back:                   langmesh configure workspace.strategy --unset
#
# A name that is not in the schema is refused rather than written and ignored.

# Model provider credentials. Each also resolves from that provider's conventional environment
# variable, which wins over anything written here. Which model a session runs is chosen by its
# agent profile, not here. The full provider list is in langmesh.base.identity.providers.
providers:
  anthropic:
    api_key: ""
  openai:
    api_key: ""
  google:
    api_key: ""
  openrouter:
    api_key: ""
  xai:
    api_key: ""

# Exa backs the built-in web search. EXA_API_KEY can supply this instead.
exa:
  api_key: ""

# Read-only credential and toolchain roots needed by ordinary project commands.
sandbox:
  filesystem:
    readable:
      - "~/.agents"
      - "~/.config"
      - "~/.local"
      - "~/.ssh"
      - "~/.gitconfig"
      - "~/.gitignore_global"
      - "~/.cargo"
      - "~/.rustup"
      - "~/.npmrc"
      - "~/.nvm"
      - "~/.pyenv"
      - "~/.docker"
      - "~/.netrc"
      - "~/Library/Keychains"

# Conversation history always streams continuously from newest to oldest; there is no paging or row-limit setting.
compaction:
  automatic: true
  reclaim_at_fraction: 0.85
  output_reserve_fraction: 0.1
  recent_working_set_fraction: 0.15
  # How many times the hidden summarizer may be asked again after reviewing but not submitting.
  summary_attempts: 3

# How an independent goal review is driven.
goal_review:
  # How many times a reviewer that investigated but never submitted is asked again on a narrowed toolset.
  maximum_attempts: 3
