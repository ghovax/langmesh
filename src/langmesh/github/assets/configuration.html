<h1>Configure LangMesh</h1>
<p>These settings apply only to this GitHub App installation.</p>
<form method="post" action="/github/configure">
  <label>Provider <input name="provider" required value="{{ provider }}" /></label>
  <label>Model <input name="model" required value="{{ model }}" /></label>
  <label>API key <input name="api_key" type="password" placeholder="Leave blank to keep the current key" /></label>
  <button type="submit">Save configuration</button>
</form>
