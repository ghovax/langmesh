<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 3rem 1.25rem; }
      main { max-width: 38rem; margin: 0 auto; line-height: 1.5; }
      input { box-sizing: border-box; width: 100%; margin-top: .35rem; padding: .6rem; font: inherit; }
      label { display: block; margin: 1rem 0; }
      button { padding: .6rem 1rem; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>{{ body }}</main>
  </body>
</html>
